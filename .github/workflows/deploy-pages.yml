name: GitHub Pages'e yayınla

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Bağımlılıkları kur
        run: npm ci

      - name: Statik siteyi derle
        run: npm run build
        env:
          # Özel domain (vitrinweb.com.tr) kök dizinden sunulur; GitHub Pages'in kendi
          # alt yolu (kullanıcı-adı.github.io/vitrinwebsite/) burada söz konusu değil,
          # bu yüzden basePath GEREKMEZ. "true" yapılırsa her link/asset yanlışlıkla
          # /vitrinwebsite/ önekiyle üretilir (bkz. #11 ve bu PR).
          GITHUB_PAGES: "false"
          NEXT_PUBLIC_SITE_URL: "https://vitrinweb.com.tr"
          NEXT_PUBLIC_ORDER_WEBHOOK_URL: ${{ secrets.ORDER_WEBHOOK_URL }}
          NEXT_PUBLIC_ORDER_WEBHOOK_SECRET: ${{ secrets.ORDER_WEBHOOK_SECRET }}
          NEXT_PUBLIC_CONTACT_FORM_URL: ${{ secrets.CONTACT_FORM_URL }}
          NEXT_PUBLIC_CONTACT_FORM_SECRET: ${{ secrets.CONTACT_FORM_SECRET }}

      - name: Pages için hazırla
        uses: actions/configure-pages@v5

      - name: Derleme çıktısını yükle
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: GitHub Pages'e yayınla
        id: deployment
        uses: actions/deploy-pages@v4
